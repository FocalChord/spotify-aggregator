[project]
name = "spotify-aggregator"
version = "0.1.0"
description = "Aggregate multiple Spotify playlists into a single master playlist"
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.23.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
spotify-aggregate = "spotify_aggregator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_aggregator"]
