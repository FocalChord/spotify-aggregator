# Target playlist may be a Spotify playlist ID (most reliable), an exact
# name, or a glob pattern.
target_playlist: "0OGOhsdqasxSwiV10IvOMK"  # All Years

# Year playlists are discovered automatically: any playlist you own whose
# name matches this glob is included, sorted by name. When Spotify's
# listing endpoint is unavailable (it intermittently returns an empty list
# to datacenter IPs like GitHub runners), discovery falls back to the
# committed .playlist_cache.json from the last successful discovery.
discover_pattern: "20[0-9][0-9]"

# Extra playlists to aggregate in addition to the discovered ones.
# Entries may be playlist IDs (reliable everywhere), exact names, or globs
# (names/globs need the listing endpoint, so prefer IDs).
extra_playlists:
  - "5fFkqI0EomE4fNAiDkTn5S"  # True vibes
  - "5elXQYqwdY2LQyPc1oYToq"  # a
  - "4yJ0EHhLlE532tYOhYBkof"  # K B

# Instead of appending extra playlists' tracks at the end of the target,
# slot each track into the target's year section matching when it was
# added to its extra playlist (years clamped to existing year playlists).
route_extras_by_added_year: true
